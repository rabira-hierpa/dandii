name: dandii

services:
  postgis:
    image: postgis/postgis
    container_name: dandii-dev-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gtfs_dev_db
    ports:
      # Bound to localhost only — reachable from the host machine (e.g. for
      # `prisma studio` or an SSH tunnel) but never from the public internet.
      # 5433 avoids clashing with a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gtfs_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  otp:
    # PINNED by digest, not `:latest`. `:latest` tracks a rolling dev-2.x
    # snapshot; when prod pulled a newer snapshot than the one that built the
    # graph, every /plan request crashed with "Index N out of bounds for
    # length 0" (empty internal collections) while local kept working on the
    # older image. This digest is the known-good build. To upgrade: pull a new
    # digest deliberately AND wipe the graph.obj volume so it rebuilds clean.
    image: opentripplanner/opentripplanner@sha256:130408b5deb35a375173b404ba3c2a489f85105ba221093fe211266825ae9167
    container_name: otp-routing
    restart: unless-stopped
    ports:
      # Host port 8081 (not 8080) — avoids clashing with another app already
      # using 8080 on the VPS. Internal container port stays 8080; `web`
      # talks to it over the Docker network via OTP_URL=http://otp:8080.
      - "127.0.0.1:8081:8080"
    volumes:
      # Contains et-addisababa-gtfs-2026.zip (per-operator agencies) AND
      # addis.osm.pbf (Addis street network, clipped from the Geofabrik
      # Ethiopia extract to the transit bbox). The OSM layer gives OTP a real
      # walk network: coordinate-based planning works, walk legs get street
      # geometry (no more broken lines), and stop-to-stop transfers route over
      # streets — required by the /api/directions OTP transfer fallback.
      - ./otp-data:/var/opentripplanner
    # Rebuild the graph from the GTFS zip on boot rather than loading a
    # graph.obj that may have been produced by a different image. With the
    # image now pinned, you can switch to "--load --serve" for fast restarts
    # once a graph.obj built by THIS digest exists on the volume.
    command: "--build --save --serve"

  web:
    build: ./web
    container_name: dandii-web
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      otp:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      # The base GTFS feed the exporter rewrites. Bind-mounted rather than
      # baked in: the build context is ./web, so data/ is not in the image at
      # all. Mounting it means updating the feed is a file copy plus a reseed
      # rather than an image rebuild. Read-only — the exporter only reads it.
      # This path is BASE_DIR_CANDIDATES[1] in lib/gtfs-export.ts, so
      # GTFS_BASE_DIR does not need setting.
      - ./data:/app/data:ro
      # Generated feed zips. A named volume because the container writes here
      # and the files must outlive a redeploy — without one, every published
      # feed version is lost on the next deploy.
      - gtfs_exports:/app/.gtfs-exports
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgis:5432/gtfs_dev_db
      OTP_URL: http://otp:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      G4A_TAG: ${G4A_TAG}
      # Must match the volume above. The default resolves to /.gtfs-exports,
      # outside /app and outside any volume.
      GTFS_EXPORT_DIR: /app/.gtfs-exports
      # Console invitations email through Resend. Unset is survivable — the UI
      # falls back to "share this link directly" — but then every operator
      # invite is hand-delivered.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Escape hatch if the feed is mounted somewhere other than /app/data.
      GTFS_BASE_DIR: ${GTFS_BASE_DIR:-}

volumes:
  gtfs_exports:
  postgis_data:
