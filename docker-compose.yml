name: dandii

services:
  postgis:
    image: postgis/postgis
    container_name: dandii-dev-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gtfs_dev_db
    ports:
      # Bound to localhost only — reachable from the host machine (e.g. for
      # `prisma studio` or an SSH tunnel) but never from the public internet.
      # 5433 avoids clashing with a locally installed Postgres.
      # Host bindings are parameterized because one VPS runs more than one
      # stack (dev and production side by side) and a fixed host port means
      # the second stack cannot start: "port is already allocated". Defaults
      # are the local-dev values, so nothing changes on a developer machine.
      - "${POSTGIS_BIND:-127.0.0.1:5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gtfs_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    container_name: dandii-web
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-3000}:3000"
    volumes:
      # The base GTFS feed the exporter rewrites. Bind-mounted rather than
      # baked in: the build context is ./web, so data/ is not in the image at
      # all. Mounting it means updating the feed is a file copy plus a reseed
      # rather than an image rebuild. Read-only — the exporter only reads it.
      # This path is BASE_DIR_CANDIDATES[1] in lib/gtfs-export.ts, so
      # GTFS_BASE_DIR does not need setting.
      - ./data:/app/data:ro
      # Generated feed zips. A named volume because the container writes here
      # and the files must outlive a redeploy — without one, every published
      # feed version is lost on the next deploy.
      - gtfs_exports:/app/.gtfs-exports
    networks:
      # Project-default network for postgis, plus the shared one that carries
      # OTP. Naming `default` explicitly is required: declaring any network on
      # a service replaces the implicit default rather than adding to it, and
      # dropping it would cut web off from postgis.
      - default
      - dandii-shared
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgis:5432/gtfs_dev_db
      # Resolves through the `otp` alias on dandii-shared. Override only if
      # OTP lives somewhere this network cannot reach.
      OTP_URL: ${OTP_URL:-http://otp:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      G4A_TAG: ${G4A_TAG}
      # Must match the volume above. The default resolves to /.gtfs-exports,
      # outside /app and outside any volume.
      GTFS_EXPORT_DIR: /app/.gtfs-exports
      # Console invitations email through Resend. Unset is survivable — the UI
      # falls back to "share this link directly" — but then every operator
      # invite is hand-delivered.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Escape hatch if the feed is mounted somewhere other than /app/data.
      GTFS_BASE_DIR: ${GTFS_BASE_DIR:-}

volumes:
  gtfs_exports:
  postgis_data:

networks:
  # Created once per host: `docker network create dandii-shared`. External so
  # that neither stack owns it — dev and production both attach, and tearing
  # one down leaves the other's OTP link intact.
  dandii-shared:
    external: true
