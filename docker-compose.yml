name: dandii

services:
  postgis:
    image: postgis/postgis
    container_name: dandii-dev-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gtfs_dev_db
    ports:
      # Bound to localhost only — reachable from the host machine (e.g. for
      # `prisma studio` or an SSH tunnel) but never from the public internet.
      # 5433 avoids clashing with a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gtfs_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  otp:
    # PINNED by digest, not `:latest`. `:latest` tracks a rolling dev-2.x
    # snapshot; when prod pulled a newer snapshot than the one that built the
    # graph, every /plan request crashed with "Index N out of bounds for
    # length 0" (empty internal collections) while local kept working on the
    # older image. This digest is the known-good build. To upgrade: pull a new
    # digest deliberately AND wipe the graph.obj volume so it rebuilds clean.
    image: opentripplanner/opentripplanner@sha256:130408b5deb35a375173b404ba3c2a489f85105ba221093fe211266825ae9167
    container_name: otp-routing
    restart: unless-stopped
    ports:
      # Host port 8081 (not 8080) — avoids clashing with another app already
      # using 8080 on the VPS. Internal container port stays 8080; `web`
      # talks to it over the Docker network via OTP_URL=http://otp:8080.
      - "127.0.0.1:8081:8080"
    volumes:
      # Contains et-addisababa-gtfs-2026.zip (no OSM extract — OTP runs
      # transit-only, no street-level walk legs).
      - ./otp-data:/var/opentripplanner
    # Rebuild the graph from the GTFS zip on boot rather than loading a
    # graph.obj that may have been produced by a different image. With the
    # image now pinned, you can switch to "--load --serve" for fast restarts
    # once a graph.obj built by THIS digest exists on the volume.
    command: "--build --save --serve"

  web:
    build: ./web
    container_name: dandii-web
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      otp:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgis:5432/gtfs_dev_db
      OTP_URL: http://otp:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      G4A_TAG: ${G4A_TAG}

volumes:
  postgis_data:
